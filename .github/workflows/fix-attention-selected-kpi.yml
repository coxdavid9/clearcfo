name: Update attention panel for selected KPI
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove selected KPI attention workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attention panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text()
          anchor = '  const selectedMetric = expandedMetric ? metrics.find((metric) => metric.key === expandedMetric) : null;\n'
          insert = '''  const attentionDrivers = useMemo(() => {\n    const keywordMap: Record<string, string[]> = {\n      revenue: ["revenue", "sales", "top-line"],\n      margin: ["margin", "cogs", "gross profit", "direct cost", "pricing", "product mix"],\n      cash: ["cash", "liquidity", "working capital", "cash flow"],\n      inventory: ["inventory", "stock", "working capital"]\n    };\n    const keywords = keywordMap[activeMetricKey] || keywordMap.revenue;\n    const matches = data.drivers.filter((driver) => {\n      const text = `${driver.category} ${driver.title} ${driver.observation} ${driver.evidence.join(" ")}`.toLowerCase();\n      return keywords.some((keyword) => text.includes(keyword));\n    });\n    return matches.slice(0, 3);\n  }, [activeMetricKey, data.drivers]);\n'''
          if anchor not in s:
              raise SystemExit('selected metric anchor not found')
          s = s.replace(anchor, anchor + insert, 1)
          old = '''<div className="rounded-2xl border border-amber-200 bg-gradient-to-br from-amber-50 to-white p-6 shadow-sm sm:p-7">\n              <div className="flex items-center justify-between gap-3"><p className="text-sm font-semibold text-slate-900">What needs attention</p><span className="rounded-full bg-amber-100 px-2.5 py-1 text-[11px] font-bold text-amber-700">{data.drivers.length} {data.drivers.length === 1 ? "item" : "items"}</span></div>\n              <div className="mt-4 space-y-3">\n                {data.drivers.length ? data.drivers.slice(0, 3).map((driver) => <div key={driver.id} className="w-full rounded-xl border border-amber-100 bg-white/80 p-3 text-left">\n                  <div className="flex items-start justify-between gap-3"><p className="text-xs font-semibold text-slate-900">{driver.title}</p><span className={`shrink-0 text-[10px] font-bold uppercase tracking-wide ${driver.severity === "High" ? "text-red-600" : driver.severity === "Medium" ? "text-amber-600" : "text-slate-400"}`}>{driver.severity}</span></div>\n                  <p className="mt-1 text-xs leading-5 text-slate-500">{driver.observation}</p>\n                </div>) : <p className="text-sm text-slate-500">No major financial issues were detected.</p>}\n              </div>\n            </div>'''
          new = '''<div className="rounded-2xl border border-amber-200 bg-gradient-to-br from-amber-50 to-white p-6 shadow-sm sm:p-7">\n              <div className="flex items-center justify-between gap-3"><p className="text-sm font-semibold text-slate-900">What needs attention</p><span className="rounded-full bg-amber-100 px-2.5 py-1 text-[11px] font-bold text-amber-700">{attentionDrivers.length} {attentionDrivers.length === 1 ? "item" : "items"}</span></div>\n              <p className="mt-1 text-xs text-slate-500">Focused on {activeMetric.name}.</p>\n              <div className="mt-4 space-y-3">\n                {attentionDrivers.length ? attentionDrivers.map((driver) => <div key={driver.id} className="w-full rounded-xl border border-amber-100 bg-white/80 p-3 text-left">\n                  <div className="flex items-start justify-between gap-3"><p className="text-xs font-semibold text-slate-900">{driver.title}</p><span className={`shrink-0 text-[10px] font-bold uppercase tracking-wide ${driver.severity === "High" ? "text-red-600" : driver.severity === "Medium" ? "text-amber-600" : "text-slate-400"}`}>{driver.severity}</span></div>\n                  <p className="mt-1 text-xs leading-5 text-slate-500">{driver.observation}</p>\n                </div>) : <p className="text-sm text-slate-500">No specific issues were detected for {activeMetric.name.toLowerCase()}.</p>}\n              </div>\n            </div>'''
          if old not in s:
              raise SystemExit('attention panel not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CFOBriefing.tsx
          git commit -m 'Make attention panel follow selected KPI'
          git push
