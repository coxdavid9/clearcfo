name: Parser cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[parser-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invented company fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/CFOBriefing.tsx')
          text = path.read_text()
          old = '  return "Your Business";'
          new = '  return "";'
          if old not in text:
              raise SystemExit('Expected company fallback was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git commit -m "Remove invented company name fallback"
          git push
