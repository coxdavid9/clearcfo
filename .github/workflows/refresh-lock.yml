name: Refresh dependency lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, '[refresh-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dependency lockfile [skip ci]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/refresh-lock.yml
          git commit -m "Remove temporary lockfile workflow [skip ci]"
          git push
