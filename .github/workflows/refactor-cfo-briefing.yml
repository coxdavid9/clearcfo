name: Refactor CFO Briefing Phase 1

on:
  push:
    branches:
      - refactor/cfo-briefing-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor CFO briefing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/components/CFOBriefing.tsx")
          text = path.read_text()

          if Path("src/lib/briefing/engine.ts").exists():
              print("Phase 1 refactor already exists; nothing to do.")
              raise SystemExit(0)

          match = re.search(r"^export default function ", text, re.M)
          if not match:
              match = re.search(r"^export function CFOBriefing", text, re.M)
          if not match:
              raise SystemExit("Could not locate CFOBriefing component declaration safely.")

          component_start = match.start()
          prefix = text[:component_start]
          component = text[component_start:]

          marker = re.search(r"^type BriefingData", prefix, re.M)
          if not marker:
              raise SystemExit("Could not locate the briefing declarations safely.")

          imports = prefix[:marker.start()].rstrip() + "\n"
          declarations = prefix[marker.start():].strip() + "\n"

          declaration_kinds = {}
          pattern = r"^(type|interface|const|let|var|function)[ \t]+([A-Za-z_$][A-Za-z0-9_$]*)"
          for m in re.finditer(pattern, declarations, re.M):
              declaration_kinds[m.group(2)] = m.group(1)

          exported = re.sub(
              pattern,
              lambda m: "export " + m.group(0),
              declarations,
              flags=re.M,
          )

          engine = 'import * as XLSX from "xlsx";\n\n' + exported
          engine_path = Path("src/lib/briefing/engine.ts")
          engine_path.parent.mkdir(parents=True, exist_ok=True)
          engine_path.write_text(engine)

          referenced = []
          for name, kind in declaration_kinds.items():
              if re.search(r"\b" + re.escape(name) + r"\b", component):
                  referenced.append((name, kind))

          imports_lines = []
          for name, kind in referenced:
              imports_lines.append(("type " if kind in {"type", "interface"} else "") + name)

          generated_import = "import {\n  " + ",\n  ".join(imports_lines) + "\n} from \"../lib/briefing/engine\";\n"
          path.write_text(imports + generated_import + "\n" + component)

          if "type BriefingData" in component or "const demoData" in component:
              raise SystemExit("Refactor validation failed: declarations still remain in CFOBriefing.tsx.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit refactor and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx src/lib/briefing/engine.ts .github/workflows/refactor-cfo-briefing.yml
          git commit -m "refactor: split CFO briefing engine from UI" --author="github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
