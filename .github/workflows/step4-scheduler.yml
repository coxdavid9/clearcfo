name: ClearCFO Step 4 Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due ClearCFO emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --max-time 600 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://theclearcfo.com/api/jobs/dispatch
