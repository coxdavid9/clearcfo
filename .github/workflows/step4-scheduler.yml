name: ClearCFO Step 4 Scheduler

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "30 12 * * 1"
  workflow_dispatch:

jobs:
  run-scheduled-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily QuickBooks sync and alerts
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --max-time 600 -X POST             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json"             https://theclearcfo.com/api/jobs/sync-all

      - name: Run weekly CFO report
        if: github.event.schedule == '30 12 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --max-time 600 -X POST             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json"             https://theclearcfo.com/api/jobs/weekly-report
