name: ClearCFO Step 4 Scheduler (manual backfill only)

# NOTE: The every-5-minutes schedule now lives on Render as a native cron job
# (see render.yaml -> clearcfo-dispatcher). GitHub Actions throttled the
# `schedule` trigger to hours-apart firings, which delayed alert/weekly emails.
# This workflow is kept for MANUAL backfills only (workflow_dispatch).
# Do NOT re-add a `schedule` trigger here or emails may double-dispatch.

on:
  workflow_dispatch:

jobs:
  run-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due ClearCFO emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --max-time 600 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://theclearcfo.com/api/jobs/dispatch
