name: Encrypted Supabase database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
    steps:
      - name: Download and decrypt newest backup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/restore-drill"
          cd "$RUNNER_TEMP/restore-drill"
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          key="$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix database/ \
            --endpoint-url "$endpoint" --query 'sort_by(Contents,&Key)[-1].Key' --output text)"
          [[ "$key" =~ ^database/[0-9TZ-]+[.]dump[.]enc$ ]]
          aws s3 cp "s3://$R2_BUCKET/$key" database.dump.enc --endpoint-url "$endpoint" --only-show-errors
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in database.dump.enc -out database.dump -pass env:BACKUP_ENCRYPTION_KEY
          echo "Decrypted $key"
      - name: Restore into isolated Supabase PostgreSQL
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/restore-drill"
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          docker run -d --name restore-drill --network none -e POSTGRES_PASSWORD supabase/postgres:17.6.1.136
          for attempt in {1..60}; do
            if docker exec restore-drill pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 2
          done
          docker exec restore-drill createdb -U postgres -T template0 clearcfo_restore_drill
          if ! docker exec -i restore-drill pg_restore -U postgres -d clearcfo_restore_drill \
            --no-owner --no-acl --exit-on-error < database.dump > restore.log 2>&1; then
            echo "::error::Database restore failed. Diagnostic output is limited to archive object types."
            awk '/from TOC entry/ {print "Failed archive entry:", $5, $6, $7}' restore.log
            for reason in 'unsupported version' 'transaction_timeout' 'unrecognized configuration parameter' 'permission denied' 'does not exist' 'already exists' 'connection to server' 'not a valid archive' 'could not read' 'not available' 'authentication failed'; do
              if grep -Fqi "$reason" restore.log; then echo "Restore error category: $reason"; fi
            done
            exit 1
          fi
      - name: Verify restored tables
        run: |
          docker exec -i restore-drill psql -U postgres -d clearcfo_restore_drill -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS restored_accounts FROM auth.users;
          SELECT count(*) AS restored_subscriptions FROM public.subscriptions;
          SELECT count(*) AS restored_promo_codes FROM public.promo_codes;
          SQL
      - name: Remove disposable restore and local files
        if: always()
        run: |
          docker rm -fv restore-drill 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/restore-drill"
