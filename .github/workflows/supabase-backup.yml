name: Encrypted Supabase database backup

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
    steps:
      - name: Verify backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL BACKUP_ENCRYPTION_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing backup configuration: $key"; exit 1; fi
          done
      - name: Dump PostgreSQL 17 database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/clearcfo-backup"
          docker run --rm --network host \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/clearcfo-backup:/backup" \
            postgres:17 bash -euo pipefail -c \
            'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/database.dump'
          test -s "$RUNNER_TEMP/clearcfo-backup/database.dump"
      - name: Encrypt and upload off-site
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          file="$RUNNER_TEMP/clearcfo-backup/database.dump"
          encrypted="$RUNNER_TEMP/clearcfo-backup/clearcfo-$stamp.dump.enc"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$file" -out "$encrypted" -pass env:BACKUP_ENCRYPTION_KEY
          shred -u "$file" || rm -f "$file"
          aws s3 cp "$encrypted" "s3://$R2_BUCKET/database/$stamp.dump.enc" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          aws s3api head-object --bucket "$R2_BUCKET" --key "database/$stamp.dump.enc" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >/dev/null
          echo "Encrypted backup uploaded and verified: database/$stamp.dump.enc"
      - name: Remove local backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/clearcfo-backup"
