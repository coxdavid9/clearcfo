name: Apply uploaded trend fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          INSERT_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text(encoding='utf-8')
          if 'Fix uploaded workbook trend series' == '${{ github.event.head_commit.message }}':
              raise SystemExit(0)
          marker = '  const latestMetricIndex = isMetricRowFormat'
          if marker not in s:
              raise SystemExit('Trend insertion marker not found')
          insert = base64.b64decode(__import__('os').environ['INSERT_B64']).decode('utf-8')
          if insert.strip() not in s:
              p.write_text(s.replace(marker, insert + marker, 1), encoding='utf-8')
          PY
      - name: Commit trend fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git diff --cached --quiet || git commit -m "Fix uploaded workbook trend series"
          git push
