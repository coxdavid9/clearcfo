name: Implement Trend Detail V3

on:
  push:
    branches: [main]

jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace component
        env:
          COMPONENT_B64: "<REDACTED>"
        run: |
          python - <<'PY'
          import base64, os
          with open('src/components/TrendDetailOverlay.tsx', 'wb') as f:
              f.write(base64.b64decode(os.environ['COMPONENT_B64']))
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TrendDetailOverlay.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve financial trend detail screen [skip ci]"
          git push
