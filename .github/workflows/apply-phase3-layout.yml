name: Apply ClearCFO Phase 3 layout

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'phase 3 layout') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout and explanation changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          route = Path('src/app/api/cfo-analysis/route.ts')
          s = route.read_text()
          s = s.replace('  "Keep whyItMatters to 2 or 3 short sentences and target roughly 55 words or fewer. Do not repeat the executiveSummary, evidence list, recommendedAction, or unknowns verbatim; explain only the business significance of the primary driver.",\n\n', '')
          route.write_text(s)

          cfo = Path('src/components/CFOBriefing.tsx')
          s = cfo.read_text()
          helper = '''function compactWhyItMatters(text: string): string {\n  const sentences = text.match(/[^.!?]+[.!?]+/g) ?? [text];\n  let compact = sentences.slice(0, 3).join(" ").trim();\n  const words = compact.split(/\\s+/).filter(Boolean);\n  if (words.length > 55) {\n    compact = words.slice(0, 55).join(" ").replace(/[,:;]$/, "") + "…";\n  }\n  return compact;\n}\n\n'''
          if helper in s:
              s = s.replace(helper, '', 1)
          s = s.replace('{compactWhyItMatters(aiAnalysis.whyItMatters)}', '{aiAnalysis.whyItMatters}', 1)

          old = re.search(r'''              <div className="grid gap-4 md:grid-cols-3">\n                <div className="rounded-2xl bg-white p-5 shadow-sm">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Primary driver\n                  </p>\n                  <p className="mt-2 text-sm leading-6 text-slate-700">\n                    \{aiAnalysis\.primaryDriver\}\n                  </p>\n                </div>\n\n                <div className="rounded-2xl bg-white p-5 shadow-sm">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Why it matters\n                  </p>\n                  <p className="mt-2 text-sm leading-6 text-slate-700">\n                    \{aiAnalysis\.whyItMatters\}\n                  </p>\n                </div>\n\n                <div className="rounded-2xl bg-white p-5 shadow-sm">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Management question\n                  </p>\n                  <p className="mt-2 text-sm leading-6 text-slate-700">\n                    \{aiAnalysis\.managementQuestion\}\n                  </p>\n                </div>\n              </div>''', s)
          if not old:
              raise SystemExit('AI cards block not found')
          new = '''              <div className="grid gap-4 md:grid-cols-2">\n                <div className="rounded-2xl bg-white p-5 shadow-sm">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Primary driver\n                  </p>\n                  <p className="mt-2 text-sm leading-6 text-slate-700">\n                    {aiAnalysis.primaryDriver}\n                  </p>\n                </div>\n\n                <div className="rounded-2xl bg-white p-5 shadow-sm">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Management question\n                  </p>\n                  <p className="mt-2 text-sm leading-6 text-slate-700">\n                    {aiAnalysis.managementQuestion}\n                  </p>\n                </div>\n\n                <div className="rounded-2xl bg-white p-6 shadow-sm md:col-span-2">\n                  <p className="text-xs font-bold uppercase tracking-wide text-slate-400">\n                    Why it matters\n                  </p>\n                  <p className="mt-3 max-w-4xl text-sm leading-7 text-slate-700">\n                    {aiAnalysis.whyItMatters}\n                  </p>\n                </div>\n              </div>'''
          s = s[:old.start()] + new + s[old.end():]
          cfo.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/cfo-analysis/route.ts src/components/CFOBriefing.tsx
          git commit -m "fix: phase 3 layout and explanation"
          git push
