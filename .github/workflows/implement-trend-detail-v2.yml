name: Implement Trend Detail V2

on:
  push:
    branches: [main]

jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace trend detail component
        env:
          COMPONENT_B64: "PASTE_B64"
        run: |
          python - <<'PY'
          import base64, os
          content = base64.b64decode(os.environ['COMPONENT_B64']).decode('utf-8')
          with open('src/components/TrendDetailOverlay.tsx', 'w', encoding='utf-8') as f:
              f.write(content)
          PY

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TrendDetailOverlay.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: improve financial trend detail screen [skip ci]"
          git push
