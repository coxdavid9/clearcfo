name: Update financial drivers for selected KPI
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove selected KPI financial driver workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch financial drivers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text()
          anchor = '''  const attentionDrivers = useMemo(() => {\n'''
          if anchor not in s:
              raise SystemExit('attention drivers anchor not found')
          end = '''  }, [activeMetricKey, data.drivers]);\n\n  const renderMetricDetail'''
          if end not in s:
              raise SystemExit('attention drivers end not found')
          insert = '''\n  const financialDrivers = useMemo(() => {\n    const keywordMap: Record<string, string[]> = {\n      revenue: ["revenue", "sales", "top-line"],\n      margin: ["margin", "cogs", "gross profit", "direct cost", "pricing", "product mix"],\n      cash: ["cash", "liquidity", "working capital", "cash flow"],\n      inventory: ["inventory", "stock", "working capital", "purchasing"]\n    };\n    const keywords = keywordMap[activeMetricKey] || keywordMap.revenue;\n    return data.drivers.filter((driver) => {\n      const text = `${driver.category} ${driver.title} ${driver.observation} ${driver.evidence.join(" ")}`.toLowerCase();\n      return keywords.some((keyword) => text.includes(keyword));\n    });\n  }, [activeMetricKey, data.drivers]);\n'''
          s = s.replace(end, '''  }, [activeMetricKey, data.drivers]);''' + insert + '''\n  const renderMetricDetail''', 1)
          old = '''<div className="rounded-2xl border border-slate-200 bg-white p-6"><p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Financial drivers</p><div className="mt-4 space-y-3">{data.drivers.length ? data.drivers.map((driver) => <div key={driver.id} className="rounded-xl border border-slate-200 bg-slate-50 p-4"><div className="flex items-center justify-between gap-3"><p className="font-semibold text-slate-900">{driver.title}</p><span className="text-xs font-semibold uppercase tracking-wide text-slate-400">{driver.severity}</span></div><p className="mt-1 text-sm leading-6 text-slate-600">{driver.observation}</p></div>) : <p className="text-sm text-slate-500">No major financial drivers were detected.</p>}</div></div>'''
          new = '''<div className="rounded-2xl border border-slate-200 bg-white p-6"><div className="flex items-center justify-between gap-3"><p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Financial drivers</p><span className="rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold text-blue-600">{activeMetric.name}</span></div><p className="mt-1 text-xs text-slate-500">Drivers affecting the selected KPI.</p><div className="mt-4 space-y-3">{financialDrivers.length ? financialDrivers.map((driver) => <div key={driver.id} className="rounded-xl border border-slate-200 bg-slate-50 p-4"><div className="flex items-center justify-between gap-3"><p className="font-semibold text-slate-900">{driver.title}</p><span className="text-xs font-semibold uppercase tracking-wide text-slate-400">{driver.severity}</span></div><p className="mt-1 text-sm leading-6 text-slate-600">{driver.observation}</p></div>) : <p className="text-sm text-slate-500">No specific financial drivers were detected for {activeMetric.name.toLowerCase()}.</p>}</div></div>'''
          if old not in s:
              raise SystemExit('financial drivers panel not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CFOBriefing.tsx
          git commit -m 'Make financial drivers follow selected KPI'
          git push
