name: Apply ClearCFO Phase 3

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'phase 3 AI hardening') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 3 AI hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/cfo-analysis/route.ts')
          s = route.read_text()
          anchor = '  "Keep the explanation concise enough for a business owner, controller, or CFO to use in a management meeting.",\n'
          addition = anchor + '\n  "Keep whyItMatters to 2 or 3 short sentences and target roughly 55 words or fewer. Do not repeat the executiveSummary, evidence list, recommendedAction, or unknowns verbatim; explain only the business significance of the primary driver.",\n\n  "Use calibrated causal language. Prefer phrases such as coincides with, is consistent with, may contribute to, can indicate, suggests, or warrants investigation. Do not say an event caused another outcome unless the supplied evidence explicitly establishes causation.",\n'
          if anchor not in s:
              raise SystemExit('route anchor not found')
          s = s.replace(anchor, addition, 1)
          route.write_text(s)

          cfo = Path('src/components/CFOBriefing.tsx')
          s = cfo.read_text()
          marker = 'function analyzeWorkbook'
          helper = '''function compactWhyItMatters(text: string): string {\n  const sentences = text.match(/[^.!?]+[.!?]+/g) ?? [text];\n  let compact = sentences.slice(0, 3).join(" ").trim();\n  const words = compact.split(/\\s+/).filter(Boolean);\n  if (words.length > 55) {\n    compact = words.slice(0, 55).join(" ").replace(/[,:;]$/, "") + "…";\n  }\n  return compact;\n}\n\n'''
          if marker not in s:
              raise SystemExit('CFO marker not found')
          if 'function compactWhyItMatters' not in s:
              s = s.replace(marker, helper + marker, 1)
          import re
          pattern = r'(<p[^>]*>\\s*)\\{aiAnalysis\\.whyItMatters\\}(\\s*</p>)'
          s2, count = re.subn(pattern, r'\\1{compactWhyItMatters(aiAnalysis.whyItMatters)}\\2', s, count=1)
          if count != 1:
              raise SystemExit(f'Why It Matters render not found: {count}')
          cfo.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/cfo-analysis/route.ts src/components/CFOBriefing.tsx
          git commit -m "fix: phase 3 AI hardening"
          git push
