name: Patch trend spike insight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: add trend spike insight') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch trend insight logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/CFOBriefing.tsx')
          text = path.read_text()

          marker = '''  // Only fall back to a generic trend statement when the data does not support\n  // a stronger cross-metric interpretation.\n'''
          insertion = '''  // Detect material one-period spikes that a simple start-to-end change can hide.\n  // A spike is a point that moves materially above its immediate neighbors and then\n  // falls back toward the prior level. This is especially useful for expense lines.\n  if (insights.length < 3) {\n    for (const series of seriesMap) {\n      const values = series.values;\n      if (values.length < 4) continue;\n\n      let bestIndex = -1;\n      let bestScore = 0;\n\n      for (let i = 1; i < values.length - 1; i++) {\n        const before = values[i - 1];\n        const peak = values[i];\n        const after = values[i + 1];\n        if (![before, peak, after].every(Number.isFinite) || before === 0 || peak === 0) continue;\n\n        const rise = ((peak - before) / Math.abs(before)) * 100;\n        const fall = ((peak - after) / Math.abs(peak)) * 100;\n        const neighborAvg = (Math.abs(before) + Math.abs(after)) / 2;\n        const deviation = neighborAvg > 0\n          ? ((Math.abs(peak) - neighborAvg) / neighborAvg) * 100\n          : 0;\n\n        if (rise >= 20 && fall >= 15 && deviation > bestScore) {\n          bestIndex = i;\n          bestScore = deviation;\n        }\n      }\n\n      if (bestIndex >= 0) {\n        const peak = values[bestIndex];\n        const peakPeriod = series.periods[bestIndex] ?? "the period";\n        const endValue = values[values.length - 1];\n        const endPeriod = series.periods[series.periods.length - 1] ?? "the latest period";\n        const recovery = Math.abs(endValue - peak) / Math.abs(peak) * 100;\n\n        insights.push(\n          `${series.name} spiked sharply in ${peakPeriod} to ${formatCurrency(peak)} before falling back to ${formatCurrency(endValue)} in ${endPeriod}. The temporary spike warrants review to determine whether it was driven by a one-time item or a recurring cost issue.`\n        );\n\n        if (recovery >= 15) break;\n      }\n    }\n  }\n\n'''

          if marker not in text:
              raise SystemExit('Trend insight insertion marker not found')

          if 'Detect material one-period spikes that a simple start-to-end change can hide.' not in text:
              text = text.replace(marker, insertion + marker, 1)
              path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CFOBriefing.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: add trend spike insight'
          git push
