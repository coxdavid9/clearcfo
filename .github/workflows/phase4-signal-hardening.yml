name: Apply ClearCFO Phase 4 signal hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten relationship thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text()
          original = s

          s = s.replace(
              'if (inventoryChange > 0 && revenueChange < inventoryChange) {',
              'if (inventoryChange >= 5 && inventoryChange > revenueChange + 3) {',
              1,
          )

          s = s.replace(
              'if (inventoryChange > 0 && cashChange < 0) {',
              'if (inventoryChange >= 5 && cashChange <= -5) {',
              1,
          )

          if s == original:
              raise SystemExit('Expected relationship rules were not found')

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git commit -m "fix: reduce noisy financial relationships"
          git push
