name: Apply KPI financial driver content
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d | python
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CFOBriefing.tsx
          git diff --cached --quiet || git commit -m 'Make financial drivers distinct and KPI-specific'
          git push
