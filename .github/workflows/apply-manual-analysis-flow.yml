name: Apply manual analysis testing flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'switch testing flow to manual AI analysis') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update CFO briefing flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/CFOBriefing.tsx')
          text = path.read_text()

          old_upload = '''      setData(analyzed);\n      await generateAIAnalysis(analyzed);'''
          new_upload = '''      setData(analyzed);\n      // During product testing, keep AI analysis manual so the deterministic\n      // financial engine can be verified before reasoning is evaluated.\n'''
          if old_upload not in text:
              raise SystemExit('Expected upload/analysis block was not found')
          text = text.replace(old_upload, new_upload, 1)

          old_actions = '''              <div className="mt-5 flex flex-wrap items-center gap-3">\n                {aiAnalysis ? (\n                  <button type="button" onClick={() => setShowAnalysis(true)} className="rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/30">View Full CFO Analysis →</button>\n                ) : aiLoading ? (\n                  <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700">ClearCFO is analyzing your financial data…</div>\n                ) : aiError ? (\n                  <button type="button" onClick={() => generateAIAnalysis()} disabled={aiLoading} className="rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/30">Retry Analysis</button>\n                ) : null}\n              </div>'''
          new_actions = '''              <div className="mt-5 flex flex-wrap items-center gap-3">\n                {aiAnalysis ? (\n                  <button type="button" onClick={() => setShowAnalysis(true)} className="rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/30">View Full CFO Analysis →</button>\n                ) : aiLoading ? (\n                  <div className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700">ClearCFO is analyzing your financial data…</div>\n                ) : (\n                  <button type="button" onClick={() => generateAIAnalysis()} disabled={aiLoading || data.source !== "upload"} className="rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-xl disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/30">Run ClearCFO Analysis →</button>\n                )}\n              </div>'''
          if old_actions not in text:
              raise SystemExit('Expected analysis action block was not found')
          text = text.replace(old_actions, new_actions, 1)

          path.write_text(text)
          PY

      - name: Verify and commit
        run: |
          grep -q 'Run ClearCFO Analysis' src/components/CFOBriefing.tsx
          ! grep -q 'await generateAIAnalysis(analyzed)' src/components/CFOBriefing.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CFOBriefing.tsx
          git commit -m 'chore: apply manual analysis testing flow'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-manual-analysis-flow.yml
          git commit -m 'chore: remove one-time manual analysis workflow'
          git push
