name: Apply Round 3 diagnosis patch

on:
  push:
    branches:
      - round3-diagnosis-fix-2026-09-13

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[round3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply .round3/clearcfo-round3-diagnosis-fix.patch
          rm -f .round3/clearcfo-round3-diagnosis-fix.patch .github/workflows/apply-round3-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Round 3 diagnosis fix [round3-applied]"
          git push origin HEAD:round3-diagnosis-fix-2026-09-13
