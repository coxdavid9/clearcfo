name: Add KPI-specific financial driver content
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Remove KPI financial driver workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch financial drivers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text()
          start = s.index('  const financialDrivers = useMemo(() => {')
          end = s.index('  const renderMetricDetail', start)
          new_logic = '''  const financialDrivers = useMemo(() => {
    const current = activeMetricDefinition.current;
    const change = activeMetricDefinition.change;
    const changeText = Number.isFinite(change)
      ? activeMetricKey === "margin"
        ? `${Math.abs(change).toFixed(1)} percentage points`
        : formatPercentValue(Math.abs(change))
      : "an unavailable prior-period comparison";
    const direction = Number.isFinite(change) ? (change >= 0 ? "increased" : "decreased") : "changed";
    const currentText = activeMetricKey === "margin" ? formatPercentValue(current) : currency.format(current);

    const driverMap: Record<string, Array<{ title: string; observation: string; severity: "High" | "Medium" | "Low" }>> = {
      revenue: [
        { title: "Sales volume", observation: `Revenue is ${currentText} and ${direction} by ${changeText}. Review units or customer activity to determine whether the movement is volume-driven.`, severity: change < 0 ? "High" : "Medium" },
        { title: "Pricing & mix", observation: "Compare revenue movement with pricing changes and product or customer mix to separate price effects from changes in sales activity.", severity: "Medium" },
        { title: "Customer concentration", observation: "Check whether a small number of customers are driving the change. A concentrated revenue movement can make the trend less durable than the headline KPI suggests.", severity: "Low" },
      ],
      margin: [
        { title: "Pricing", observation: `Gross margin is ${currentText} and ${direction} by ${changeText}. Review recent pricing changes and whether selling prices are keeping pace with direct costs.`, severity: change < 0 ? "High" : "Medium" },
        { title: "Direct costs", observation: "Review COGS and other direct costs for supplier price increases, labor changes, freight, or other cost movements that may be compressing margin.", severity: "Medium" },
        { title: "Product mix", observation: "Determine whether the sales mix shifted toward higher- or lower-margin products, services, or customers. Mix can move gross margin even when total revenue is stable.", severity: "Low" },
      ],
      cash: [
        { title: "Collections", observation: `Cash is ${currentText} and ${direction} by ${changeText}. Review receivables aging and collection timing to determine how much cash is being generated by operations.`, severity: change < 0 ? "High" : "Medium" },
        { title: "Working capital", observation: "Look at receivables, payables, and inventory together. Cash can tighten when working capital absorbs more cash even while the income statement remains profitable.", severity: "Medium" },
        { title: "Debt & capital spending", observation: "Separate operating cash movement from debt payments, owner distributions, and capital purchases so management can see what is actually driving available liquidity.", severity: "Low" },
      ],
      inventory: [
        { title: "Sales velocity", observation: `Inventory is ${currentText} and ${direction} by ${changeText}. Compare inventory growth with sales growth to see whether stock is building faster than demand.`, severity: change > 0 ? "High" : "Medium" },
        { title: "Purchasing", observation: "Review purchasing levels, order timing, and supplier commitments. Inventory can rise because of planned buying, minimum order quantities, or purchases made ahead of expected demand.", severity: "Medium" },
        { title: "Slow-moving stock", observation: "Identify aging or slow-moving inventory that may be tying up cash and increasing the risk of markdowns, write-downs, or obsolete stock.", severity: "Low" },
      ],
    };
    return driverMap[activeMetricKey] || driverMap.revenue;
  }, [activeMetricKey, activeMetricDefinition.current, activeMetricDefinition.change]);

'''
          s = s[:start] + new_logic + s[end:]
          old = '''<div className="rounded-2xl border border-slate-200 bg-white p-6"><div className="flex items-center justify-between gap-3"><p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Financial drivers</p><span className="rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold text-blue-600">{activeMetric.name}</span></div><p className="mt-1 text-xs text-slate-500">Drivers affecting the selected KPI.</p><div className="mt-4 space-y-3">{financialDrivers.length ? financialDrivers.map((driver) => <div key={driver.id} className="rounded-xl border border-slate-200 bg-slate-50 p-4"><div className="flex items-center justify-between gap-3"><p className="font-semibold text-slate-900">{driver.title}</p><span className="text-xs font-semibold uppercase tracking-wide text-slate-400">{driver.severity}</span></div><p className="mt-1 text-sm leading-6 text-slate-600">{driver.observation}</p></div>) : <p className="text-sm text-slate-500">No specific financial drivers were detected for {activeMetric.name.toLowerCase()}.</p>}</div></div>'''
          new = '''<div className="rounded-2xl border border-slate-200 bg-white p-6"><div className="flex items-center justify-between gap-3"><p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Financial drivers</p><span className="rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold text-blue-600">{activeMetric.name}</span></div><p className="mt-1 text-xs text-slate-500">The business factors that can move {activeMetric.name.toLowerCase()}.</p><div className="mt-4 space-y-3">{financialDrivers.map((driver) => <div key={driver.title} className="rounded-xl border border-slate-200 bg-slate-50 p-4"><div className="flex items-center justify-between gap-3"><p className="font-semibold text-slate-900">{driver.title}</p><span className={`text-xs font-semibold uppercase tracking-wide ${driver.severity === "High" ? "text-red-600" : driver.severity === "Medium" ? "text-amber-600" : "text-slate-400"}`}>{driver.severity}</span></div><p className="mt-1 text-sm leading-6 text-slate-600">{driver.observation}</p></div>)}</div></div>'''
          if old not in s:
              raise SystemExit('financial drivers panel not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CFOBriefing.tsx
          git commit -m 'Make financial drivers KPI-specific'
          git push
