name: Temporary patched dependency lockfile refresh
on:
  push:
    branches: [security/supabase-launch-gate]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched Next and matching lint dependency
        run: npm install --save-exact next@16.4.2 eslint-config-next@16.4.2
      - name: Check high severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin patched Next.js and refresh lockfile [deps-updated]"
            git push origin HEAD:security/supabase-launch-gate
          fi
