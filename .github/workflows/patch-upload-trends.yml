name: Patch upload trend series

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix uploaded workbook trend series'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CFO briefing trend ingestion
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/CFOBriefing.tsx")
          text = path.read_text(encoding="utf-8")

          marker = "  const latestMetricIndex = isMetricRowFormat"
          if marker not in text:
              raise SystemExit("Expected trend marker was not found; no changes made.")

          insertion = r'''  // Balance-sheet history must feed the same trend components as P&L history.
          // Previously cash and inventory were used only for current KPI values,
          // so uploaded workbooks could lose the four core trend cards even when
          // the workbook contained months of cash/inventory history.
          if (balanceSheetName) {
            const balanceMatrix = asMatrix(workbook, balanceSheetName);
            const balanceRows = asRows(workbook, balanceSheetName);

            const addHistoricalSeries = (
              name: string,
              aliases: string[],
              values: number[],
              seriesPeriods: string[]
            ) => {
              if (values.filter((value) => Number.isFinite(value) && value !== 0).length < 3) return;
              if (historicalSeries.some((series) => clean(series.name) === clean(name))) return;
              historicalSeries.push({ name, values: values.slice(-12), periods: seriesPeriods.slice(-12) });
            };

            // Metric-row balance sheet: Account | Dec | Jan | ... | May
            let balanceMetricHeaderIndex = -1;
            let balanceAccountIndex = -1;
            for (let r = 0; r < Math.min(balanceMatrix.length, 25); r++) {
              const row = balanceMatrix[r] ?? [];
              const accountIndex = row.findIndex((value) =>
                ["account", "metric", "category", "line item", "account name", "description"].includes(clean(value))
              );
              if (accountIndex >= 0) {
                balanceMetricHeaderIndex = r;
                balanceAccountIndex = accountIndex;
                break;
              }
            }

            if (balanceMetricHeaderIndex >= 0 && balanceAccountIndex >= 0) {
              const header = balanceMatrix[balanceMetricHeaderIndex] ?? [];
              const periodColumns = header
                .map((value, index) => ({ value, index }))
                .filter(({ index, value }) => index !== balanceAccountIndex && String(value ?? "").trim() !== "");
              const balancePeriods = periodColumns.map(({ value }) => formatPeriod(value));

              const findBalanceMetricSeries = (aliases: string[]): number[] => {
                const row = balanceMatrix.slice(balanceMetricHeaderIndex + 1).find((candidate) =>
                  aliases.some((alias) => clean(alias) === clean(candidate[balanceAccountIndex]))
                );
                if (!row) return [];
                return periodColumns.map(({ index }) => toNumber(row[index]));
              };

              addHistoricalSeries("Cash", cashAliases, findBalanceMetricSeries(cashAliases), balancePeriods);
              addHistoricalSeries("Inventory", inventoryAliases, findBalanceMetricSeries(inventoryAliases), balancePeriods);
            } else if (balanceRows.length >= 3) {
              // Row-period balance sheet: Month/Period/Date plus account columns.
              const periodKey = Object.keys(balanceRows[0] ?? {}).find((key) =>
                ["month", "period", "date", "year month", "reporting period"].includes(clean(key))
              );
              const lastBalanceRows = balanceRows.slice(-12);
              const balancePeriods = lastBalanceRows.map((row, index) =>
                periodKey ? formatPeriod(row[periodKey]) : `P-${lastBalanceRows.length - index}`
              );

              addHistoricalSeries("Cash", cashAliases, lastBalanceRows.map((row) => findValue(row, cashAliases) ?? 0), balancePeriods);
              addHistoricalSeries("Inventory", inventoryAliases, lastBalanceRows.map((row) => findValue(row, inventoryAliases) ?? 0), balancePeriods);
            }
          }

          // Some workbooks keep cash/inventory history on the same metric-row
          // financial sheet instead of a separate Balance Sheet.
          if (isMetricRowFormat) {
            const addFinancialMetricSeries = (name: string, aliases: string[]) => {
              if (historicalSeries.some((series) => clean(series.name) === clean(name))) return;
              const found = metricRows.find(({ metric }) => aliases.some((alias) => clean(alias) === clean(metric)));
              if (!found) return;
              const values = found.values.map(toNumber);
              if (values.filter((value) => Number.isFinite(value) && value !== 0).length < 3) return;
              historicalSeries.push({ name, values: values.slice(-12), periods: periods.slice(-12) });
            };

            addFinancialMetricSeries("Cash", cashAliases);
            addFinancialMetricSeries("Inventory", inventoryAliases);
          }

          // Put the four customer-facing trend cards first. Additional driver
          // series can still follow them when the workbook contains them.
          const coreTrendOrder = ["Revenue", "Inventory", "Operating Expenses", "Cash"];
          historicalSeries.sort((a, b) => {
            const aIndex = coreTrendOrder.indexOf(a.name);
            const bIndex = coreTrendOrder.indexOf(b.name);
            if (aIndex >= 0 && bIndex >= 0) return aIndex - bIndex;
            if (aIndex >= 0) return -1;
            if (bIndex >= 0) return 1;
            return 0;
          });

'''

          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git diff --cached --quiet || git commit -m "Fix uploaded workbook trend series"
          git push
