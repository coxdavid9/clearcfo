name: Finalize security hardening changes

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply remaining patch changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count:
                  p.write_text(new)

          # CFO analysis: add rate limiting if it is not already present.
          p = Path("src/app/api/cfo-analysis/route.ts")
          text = p.read_text()
          if "const limited = checkRateLimit(request, aiRateLimit);" not in text:
              text = text.replace(
                  "export async function POST(request: Request) {\n  const apiKey = process.env.OPENAI_API_KEY;",
                  "export async function POST(request: Request) {\n  // Rate limit: each analysis call costs OpenAI API money.\n  const limited = checkRateLimit(request, aiRateLimit);\n  if (limited) return limited;\n\n  const apiKey = process.env.OPENAI_API_KEY;",
                  1,
              )
          # Remove raw OpenAI response logging.
          text = text.replace(
              '''console.error(\n        "[ClearCFO AI] OpenAI returned non-JSON:",\n        rawResponse\n      );''',
              '''// Never log the raw response: it may contain derived financial data.\n      console.error(\n        `[ClearCFO AI] OpenAI returned a non-JSON response (length: ${rawResponse.length}).`\n      );''', 1)
          # Remove full payload logging.
          text = re.sub(
              r'console\.error\(\n\s*JSON\.stringify\(\n\s*payload,\n\s*null,\n\s*2\n\s*\)\n\s*\);',
              '''// Log the payload shape only — never its contents (financial data).\n      console.error(\n        `[ClearCFO AI] Payload keys: ${\n          payload && typeof payload === "object"\n            ? Object.keys(payload).join(", ")\n            : typeof payload\n        }.`\n      );''', 1, text=text)
          # Remove returned analysis text logging and sanitize parse errors.
          text = text.replace(
              '''console.error(\n        "[ClearCFO AI] Could not parse structured output:",\n        parseError\n      );\n\n      console.error(\n        "[ClearCFO AI] Returned text:",\n        text\n      );''',
              '''console.error(\n        "[ClearCFO AI] Could not parse structured output:",\n        parseError instanceof Error ? parseError.message : "Unknown parse error"\n      );\n\n      // Never log the returned text: it is the financial analysis itself.\n      console.error(\n        `[ClearCFO AI] Unparseable output length: ${text.length}.`\n      );''', 1)
          # Sanitize unexpected error object logging.
          text = re.sub(
              r'(console\.error\(\n\s*"\[ClearCFO AI\] Unexpected server error:",\n\s*)error(\n\s*\);)',
              r'\1error instanceof Error ? error.message : "Unknown error"\2',
              text, count=1)
          p.write_text(text)

          # Auth signup: add rate limiting if not already present.
          p = Path("src/app/api/auth/signup/route.ts")
          text = p.read_text()
          if "const limited = checkRateLimit(request, authRateLimit);" not in text:
              text = text.replace(
                  "export async function POST(request: Request) {\n  try {",
                  "export async function POST(request: Request) {\n  // Rate limit: slows fake-account floods.\n  const limited = checkRateLimit(request, authRateLimit);\n  if (limited) return limited;\n\n  try {",
                  1)
              p.write_text(text)

          # QuickBooks revoke on disconnect if not already present.
          p = Path("src/lib/quickbooks.ts")
          text = p.read_text()
          if "revokeIntuitTokens" not in text:
              old = '''export async function disconnectQuickBooks(userId: string) {\n  const response = await supabaseRequest(`quickbooks_connections?user_id=eq.${encodeURIComponent(userId)}`, { method: "DELETE" });\n  if (!response.ok) throw new Error(`Could not disconnect QuickBooks (${response.status}).`);\n}'''
              new = '''export async function disconnectQuickBooks(userId: string) {\n  // Revoke the tokens at Intuit first so they cannot be used after disconnect.\n  // Best-effort: the local row is deleted even if revocation fails, so a\n  // failed revoke never leaves the user stuck in a "connected" state.\n  try {\n    const connection = await getConnection(userId);\n    if (connection) {\n      await revokeIntuitTokens(decrypt(connection.refresh_token_encrypted));\n    }\n  } catch (error) {\n    console.error(\n      "[ClearCFO QuickBooks] Pre-disconnect revocation skipped:",\n      error instanceof Error ? error.message : "Unknown error"\n    );\n  }\n\n  const response = await supabaseRequest(`quickbooks_connections?user_id=eq.${encodeURIComponent(userId)}`, { method: "DELETE" });\n  if (!response.ok) throw new Error(`Could not disconnect QuickBooks (${response.status}).`);\n}\n\n/**\n * Tells Intuit to invalidate the token pair. Never throws — callers treat\n * revocation as best-effort and always finish the local disconnect.\n */\nasync function revokeIntuitTokens(refreshToken: string): Promise<void> {\n  try {\n    const { clientId, clientSecret } = config();\n    const credentials = Buffer.from(`${clientId}:${clientSecret}`).toString("base64");\n    const response = await fetch(QB_REVOKE_URL, {\n      method: "POST",\n      headers: {\n        Authorization: `Basic ${credentials}`,\n        "Content-Type": "application/x-www-form-urlencoded",\n        Accept: "application/json",\n      },\n      body: new URLSearchParams({ token: refreshToken }).toString(),\n    });\n    if (!response.ok) {\n      console.error(`[ClearCFO QuickBooks] Token revocation failed (${response.status}).`);\n    }\n  } catch (error) {\n    console.error(\n      "[ClearCFO QuickBooks] Token revocation error:",\n      error instanceof Error ? error.message : "Unknown error"\n    );\n  }\n}'''
              if old not in text:
                  raise SystemExit("QuickBooks disconnect anchor not found")
              text = text.replace(old, new, 1)
              p.write_text(text)
          PY

          # Remove temporary workflow machinery and trigger file.
          rm -f .github/workflows/apply-security-hardening.yml .github/workflows/run-security-hardening-on-pr.yml .github/workflows/finish-security-hardening.yml .github/workflows/commit-security-hardening.yml .github/workflows/finalize-security-hardening.yml SECURITY_PATCH_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.ts src/app/api/auth/login/route.ts src/app/api/auth/signup/route.ts src/app/api/cfo-analysis/route.ts src/lib/quickbooks.ts src/lib/rate-limit.ts .github/workflows SECURITY_PATCH_TRIGGER.md
          git commit -m "Complete security hardening changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
