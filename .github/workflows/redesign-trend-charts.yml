name: Redesign financial trend charts

on:
  push:
    paths:
      - '.github/workflows/redesign-trend-charts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign trend chart layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/CFOBriefing.tsx')
          text = path.read_text()
          old = 'className="mt-5 grid gap-3 md:grid-cols-2 xl:grid-cols-4"'
          new = 'className="mt-5 grid gap-4 md:grid-cols-2"'
          if old not in text:
              raise SystemExit('Expected financial trends grid was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit component change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CFOBriefing.tsx
          git commit -m 'Redesign financial trend chart layout'
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/redesign-trend-charts.yml
          git commit -m 'chore: remove temporary chart redesign workflow'
          git push
