name: Apply QuickBooks Briefing Phase 2

on:
  push:
    branches:
      - quickbooks-briefing-phase2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire QuickBooks data into CFO Briefing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/CFOBriefing.tsx")
          text = path.read_text()

          if '"quickbooks"' in text and "clearcfo:quickbooks-sync" in text:
              print("Phase 2 wiring already exists.")
              raise SystemExit(0)

          old_state = '''  const [data, setData] =\n    useState<BriefingData>(\n      demoData\n    );\n'''
          new_state = '''  const [data, setData] =\n    useState<BriefingData>(\n      demoData\n    );\n\n  const [liveSource, setLiveSource] =\n    useState<"demo" | "upload" | "quickbooks">("demo");\n'''
          if old_state not in text:
              raise SystemExit("Could not find CFO Briefing data state anchor.")
          text = text.replace(old_state, new_state, 1)

          effect_anchor = '''  const toggleMetric = (metric: ExpandedMetric) => {\n'''
          effect = '''  async function loadQuickBooksBriefing() {\n    try {\n      const statusResponse = await fetch("/api/quickbooks/status", { cache: "no-store" });\n      const statusPayload = await statusResponse.json();\n      if (!statusResponse.ok || !statusPayload?.connection?.connected) return;\n\n      const response = await fetch("/api/quickbooks/sync", { cache: "no-store" });\n      const payload = await response.json();\n      if (!response.ok || !payload?.briefing) {\n        throw new Error(payload?.error || "ClearCFO could not load your QuickBooks financial data.");\n      }\n\n      setData(payload.briefing as BriefingData);\n      setLiveSource("quickbooks");\n      setHasValidAnalysis(true);\n      setError("");\n      setAiError("");\n      setAiAnalysis(null);\n      await generateAIAnalysis(payload.briefing as BriefingData);\n    } catch (err) {\n      setHasValidAnalysis(false);\n      setError(\n        err instanceof Error\n          ? err.message\n          : "ClearCFO could not load your QuickBooks financial data."\n      );\n    }\n  }\n\n  useEffect(() => {\n    loadQuickBooksBriefing();\n\n    const handleSync = () => {\n      loadQuickBooksBriefing();\n    };\n    const handleDisconnect = () => {\n      setLiveSource("demo");\n      setHasValidAnalysis(false);\n      setError("");\n    };\n\n    window.addEventListener("clearcfo:quickbooks-sync", handleSync);\n    window.addEventListener("clearcfo:quickbooks-disconnected", handleDisconnect);\n\n    return () => {\n      window.removeEventListener("clearcfo:quickbooks-sync", handleSync);\n      window.removeEventListener("clearcfo:quickbooks-disconnected", handleDisconnect);\n    };\n  }, []);\n\n  const toggleMetric = (metric: ExpandedMetric) => {\n'''
          if effect_anchor not in text:
              raise SystemExit("Could not find CFO Briefing effect anchor.")
          text = text.replace(effect_anchor, effect, 1)

          text = text.replace(
              '      setData(analyzed);\n      setHasValidAnalysis(true);',
              '      setData(analyzed);\n      setLiveSource("upload");\n      setHasValidAnalysis(true);',
              1,
          )

          text = text.replace(
              'data.source === "upload" ? `Last analyzed: ${new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}` : "Demo financial data"',
              'liveSource === "quickbooks" ? "QuickBooks financial data" : liveSource === "upload" ? `Last analyzed: ${new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}` : "Demo financial data"',
              1,
          )

          text = text.replace(
              'data.source === "upload" ? data.companyName : "Your financial data"',
              'liveSource !== "demo" ? data.companyName : "Your financial data"',
              1,
          )

          path.write_text(text)

          qb = Path("src/components/QuickBooksConnection.tsx")
          qbtext = qb.read_text()

          old_sync = '''      setMessage(`Connection test passed. Latest period revenue: ${typeof revenue === "number" ? revenue.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }) : "available"}. Net income: ${typeof netIncome === "number" ? netIncome.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }) : "available"}.`);'''
          new_sync = '''      setMessage(`Connection test passed. Latest period revenue: ${typeof revenue === "number" ? revenue.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }) : "available"}. Net income: ${typeof netIncome === "number" ? netIncome.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }) : "available"}.`);\n      window.dispatchEvent(new Event("clearcfo:quickbooks-sync"));'''
          if old_sync not in qbtext:
              raise SystemExit("Could not find QuickBooks sync success anchor.")
          qbtext = qbtext.replace(old_sync, new_sync, 1)

          old_disconnect = '''      setConnection(null);\n      setMessage("QuickBooks disconnected. Your stored connection credentials were removed from ClearCFO.");'''
          new_disconnect = '''      setConnection(null);\n      window.dispatchEvent(new Event("clearcfo:quickbooks-disconnected"));\n      setMessage("QuickBooks disconnected. Your stored connection credentials were removed from ClearCFO.");'''
          if old_disconnect not in qbtext:
              raise SystemExit("Could not find QuickBooks disconnect anchor.")
          qbtext = qbtext.replace(old_disconnect, new_disconnect, 1)

          qb.write_text(qbtext)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-phase2.yml

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Phase 2 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx src/components/QuickBooksConnection.tsx .github/workflows/apply-phase2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: wire QuickBooks data into CFO Briefing" --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:quickbooks-briefing-phase2
