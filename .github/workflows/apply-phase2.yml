name: Apply ClearCFO Phase 2

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'phase 2 hardening for upload state') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 2 hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/CFOBriefing.tsx')
          s = p.read_text()

          replacements = [
          ('''  const [data, setData] =\n    useState<BriefingData>(\n      demoData\n    );\n\n  const [uploading, setUploading] =''', '''  const [data, setData] =\n    useState<BriefingData>(\n      demoData\n    );\n\n  const [hasValidAnalysis, setHasValidAnalysis] =\n    useState(true);\n\n  const [uploading, setUploading] ='''),
          ('''    setUploading(true);\n    setError(\"\");\n    setAiError(\"\");''', '''    setUploading(true);\n    setHasValidAnalysis(false);\n    setError(\"\");\n    setAiError(\"\");'''),
          ('''      setData(analyzed);\n      await generateAIAnalysis(analyzed);''', '''      setData(analyzed);\n      setHasValidAnalysis(true);\n      await generateAIAnalysis(analyzed);'''),
          ('''    } catch (err) {\n      setError(\n        err instanceof Error\n          ? err.message\n          : \"We couldn't read that workbook. Please check the file format and sheet names.\"\n      );''', '''    } catch (err) {\n      setHasValidAnalysis(false);\n      setError(\n        err instanceof Error\n          ? err.message\n          : \"We couldn't read that workbook. Please check the file format and sheet names.\"\n      );'''),
          ('''  return (\n    <div className=\"px-5 py-8 sm:px-8 sm:py-12 lg:py-16\">''', '''  if (!hasValidAnalysis) {\n    return (\n      <div className=\"px-5 py-8 sm:px-8 sm:py-12 lg:py-16\">\n        <input ref={fileRef} type=\"file\" accept=\".xlsx,.xls,.csv\" className=\"hidden\" onChange={handleUpload} />\n        {error && (\n          <div className=\"mx-auto mb-4 w-full max-w-6xl rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-6 text-red-800\">{error}</div>\n        )}\n        <div className=\"mx-auto w-full max-w-6xl\">{emptyState}</div>\n      </div>\n    );\n  }\n\n  return (\n    <div className=\"px-5 py-8 sm:px-8 sm:py-12 lg:py-16\">'''),
          ('''<p className=\"text-xs font-bold uppercase tracking-[0.18em] text-slate-400\">Underlying account drivers</p>''', '''<p className=\"text-xs font-bold uppercase tracking-[0.18em] text-slate-400\">Largest account movements</p>'''),
          ('''{aiAnalysis.priority} priority · {aiAnalysis.confidence >= 85 ? \"High\" : aiAnalysis.confidence >= 65 ? \"Moderate\" : \"Limited\"} confidence''', '''{data.attention === 0 ? \"Monitor\" : aiAnalysis.priority} priority · {aiAnalysis.confidence >= 85 ? \"High\" : aiAnalysis.confidence >= 65 ? \"Moderate\" : \"Limited\"} confidence''')]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'anchor not found: {old[:70]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git commit -m "fix: phase 2 hardening for upload state and analysis labels"
          git push
