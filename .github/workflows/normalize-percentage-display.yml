name: Normalize percentage display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize percentage formatting
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/normalize_percentages.py
          python3 /tmp/normalize_percentages.py

      - name: Run reasoning tests
        run: npm ci && npm run test:reasoning

      - name: Run trend tests
        run: npm run test:trends

      - name: Run production build
        run: npm run build

      - name: Commit formatting change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "fix: normalize percentage display"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/normalize-percentage-display.yml
          git add .github/workflows/normalize-percentage-display.yml
          git commit -m "chore: remove temporary percentage formatting workflow"
          git push
