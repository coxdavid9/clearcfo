name: Apply diagnosis improvements PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'analysis-pattern-detection-2026-09-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/CFOBriefing.tsx'); s=p.read_text()
          s=s.replace('  unknowns: string[];\n};','  unknowns: string[];\n  diagnosisSignals?: DiagnosisSignals;\n};',1)
          m='type ExpandedMetric =\n  | "revenue"\n  | "margin"\n  | "cash"\n  | "attention"\n  | null;'
          t=m+'''\n\ntype DiagnosisSignals = {\n  inventoryBuildup?: { multiPeriodInventoryChange:number; multiPeriodRevenueChange:number; multiPeriodCogsChange:number|null; latestInventoryDays:number|null };\n  operatingExpenseSpikeRecovery?: { peakPeriod:string; peakValue:number; baselineValue:number; excessImpact:number; recoveryPct:number };\n  revenueVolatility?: { min:number; max:number; range:number; maxMinRatio:number; periodCount:number; possibleSeasonality:boolean };\n};'''
          if m not in s: raise SystemExit('metric marker missing')
          s=s.replace(m,t,1)
          old='      ["Revenue", revenueAliases],\n      ["Gross margin", grossMarginAliases],'
          if s.count(old)<2: raise SystemExit('series markers missing')
          s=s.replace(old,'      ["Revenue", revenueAliases],\n      ["COGS", cogsAliases],\n      ["Gross margin", grossMarginAliases],',2)
          marker='\nfunction workbookContainsFinancialSignal('
          fn=r'''\nfunction buildDiagnosisSignals(seriesMap:{name:string;values:number[];periods:string[]}[]):DiagnosisSignals {\n  const find=(name:string)=>seriesMap.find(x=>clean(x.name)===clean(name));\n  const change=(v:number[])=>{const a=v.filter(Number.isFinite); if(a.length<3||a[0]===0)return 0; return ((a.at(-1)!-a[0])/Math.abs(a[0]))*100;};\n  const out:DiagnosisSignals={}; const inv=find("Inventory"), rev=find("Revenue"), cogs=find("COGS");\n  if(inv&&rev&&inv.values.length>=3&&rev.values.length>=3){\n    const ic=change(inv.values), rc=change(rev.values), cc=cogs&&cogs.values.length>=3?change(cogs.values):null;\n    const li=inv.values.at(-1)??0, lc=cogs?.values.at(-1)??0;\n    const days=li>0&&lc>0?(li/(lc*12))*365:null;\n    if(ic>=8&&ic>rc+3&&(cc===null||ic>cc+3)) out.inventoryBuildup={multiPeriodInventoryChange:ic,multiPeriodRevenueChange:rc,multiPeriodCogsChange:cc,latestInventoryDays:days};\n  }\n  const op=find("Operating Expenses");\n  if(op&&op.values.length>=4){\n    let best:any; const v=op.values;\n    for(let i=1;i<v.length-2;i++){const prior=v[i-1],peak=v[i],next=v[i+1]; if(prior<=0||peak<=0||next<=0)continue; const base=(prior+next)/2; const rec=(peak-next)/peak*100; const later=v.slice(i+1); if(base>0&&peak>=base*1.3&&rec>=10&&later.length>=2&&(v.at(-1)??next)<=peak*.9&&later.filter(x=>x<=peak*.9).length>=Math.max(2,Math.ceil(later.length*.6))){const c={peakPeriod:op.periods[i]||'a prior period',peakValue:peak,baselineValue:base,excessImpact:Math.max(0,Math.round(peak-base)),recoveryPct:rec}; if(!best||c.excessImpact>best.excessImpact)best=c;}}\n    if(best)out.operatingExpenseSpikeRecovery=best;\n  }\n  if(rev&&rev.values.length>=6){const v=rev.values.filter(x=>Number.isFinite(x)&&x>0),min=Math.min(...v),max=Math.max(...v),ratio=min>0?max/min:0; if(v.length>=6&&ratio>=1.5){const d=v.slice(1).map((x,i)=>Math.abs(x-v[i])/Math.max(v[i],1)); out.revenueVolatility={min,max,range:max-min,maxMinRatio:ratio,periodCount:v.length,possibleSeasonality:v.length>=12&&d.filter(x=>x>=.2).length>=Math.max(2,Math.floor(d.length/3))};}}\n  return out;\n}\n'''
          if marker not in s: raise SystemExit('function marker missing')
          s=s.replace(marker,fn+marker,1)
          tm='  const trendInsights = buildTrendInsights(historicalSeries, revenueChange);'
          if tm not in s: raise SystemExit('trend marker missing')
          s=s.replace(tm,tm+'\n  const diagnosisSignals = buildDiagnosisSignals(historicalSeries);',1)
          dm='''  /*\n   * ------------------------------------------------------------\n   * MULTI-PERIOD CONTEXT DRIVERS\n'''
          block=r'''  const invSignal=diagnosisSignals.inventoryBuildup;\n  if(invSignal&&!drivers.some(d=>d.id==="inventory-growth")){\n    const invSeries=historicalSeries.find(x=>clean(x.name)==="inventory");\n    const impact=invSeries?Math.max(0,Math.round((invSeries.values.at(-1)??0)-(invSeries.values[0]??0))):0;\n    drivers.push({id:"multi-period-inventory-buildup",category:"Inventory",title:"Inventory is accumulating faster than the sales base",observation:`Inventory increased ${formatPercentValue(invSignal.multiPeriodInventoryChange)}% across the displayed periods while revenue changed ${formatPercentValue(invSignal.multiPeriodRevenueChange)}%.`,evidence:[`Multi-period inventory change: ${percent(invSignal.multiPeriodInventoryChange)}`,`Multi-period revenue change: ${percent(invSignal.multiPeriodRevenueChange)}`,invSignal.multiPeriodCogsChange===null?"COGS history was not available for comparison.":`Multi-period COGS change: ${percent(invSignal.multiPeriodCogsChange)}`,invSignal.latestInventoryDays===null?"Inventory days could not be calculated from the supplied data.":`Latest inventory days: ${Math.round(invSignal.latestInventoryDays)} days`],direction:"up",severity:invSignal.multiPeriodInventoryChange-invSignal.multiPeriodRevenueChange>=8?"High":"Medium",impact,confidence:95,managementQuestion:"Which inventory categories are accumulating, and is the current purchasing cadence supported by demand?"});\n  }\n  const rec=diagnosisSignals.operatingExpenseSpikeRecovery;\n  if(rec&&!drivers.some(d=>d.id==="historical-opex-spike")){drivers.push({id:"opex-spike-recovery",category:"Operating Expense",title:"Operating expenses show a spike followed by recovery",observation:`Operating expenses peaked at ${formatCurrency(rec.peakValue)} in ${rec.peakPeriod} and have since fallen ${formatPercentValue(rec.recoveryPct)}% from the peak.`,evidence:[`Peak operating expenses: ${formatCurrency(rec.peakValue)}`,`Peak period: ${rec.peakPeriod}`,`Estimated excess versus surrounding-period baseline: ${formatCurrency(rec.excessImpact)}`,`Recovery from peak: ${formatPercentValue(rec.recoveryPct)}%`],direction:"mixed",severity:rec.excessImpact>=Math.max(25000,revenue*.05)?"High":"Medium",impact:rec.excessImpact,confidence:95,managementQuestion:"What caused the operating expense spike, and is the recovery likely to hold or recur?"}); alerts.push(`Operating expenses spiked in ${rec.peakPeriod} and have since recovered.`); priorities.push({level:rec.excessImpact>=Math.max(25000,revenue*.05)?"high":"medium",message:`Operating expenses spiked in ${rec.peakPeriod} and have since recovered.`});}\n  const vol=diagnosisSignals.revenueVolatility;\n  if(vol&&!drivers.some(d=>d.id==="revenue-volatility")){drivers.push({id:"revenue-volatility",category:"Revenue",title:vol.possibleSeasonality?"Revenue is highly volatile and may reflect seasonality":"Revenue is highly volatile across the displayed periods",observation:`Revenue ranged from ${formatCurrency(vol.min)} to ${formatCurrency(vol.max)}, a ${vol.maxMinRatio.toFixed(1)}x spread across ${vol.periodCount} periods.`,evidence:[`Minimum revenue: ${formatCurrency(vol.min)}`,`Maximum revenue: ${formatCurrency(vol.max)}`,`Max/min range: ${vol.maxMinRatio.toFixed(1)}x`],direction:"mixed",severity:vol.maxMinRatio>=2?"High":"Medium",impact:Math.round(vol.range),confidence:vol.possibleSeasonality?84:92,managementQuestion:vol.possibleSeasonality?"How much of the revenue swing is seasonal, and what does that imply for staffing, inventory, and cash planning?":"What customer, product, pricing, or timing factors explain the large revenue swings?"});}\n\n'''
          if dm not in s: raise SystemExit('driver marker missing')
          s=s.replace(dm,block+dm,1)
          rm='    trendSeries: historicalSeries.slice(-12),\n    unknowns: unknowns.slice(0, 6),'
          if rm not in s: raise SystemExit('return marker missing')
          s=s.replace(rm,'    trendSeries: historicalSeries.slice(-12),\n    unknowns: unknowns.slice(0, 6),\n    diagnosisSignals,',1)
          ai='          multiPeriodInsights: inputData.trendInsights,\n          knownUnknowns: inputData.unknowns,'
          if ai not in s: raise SystemExit('AI marker missing')
          s=s.replace(ai,'          multiPeriodInsights: inputData.trendInsights,\n          diagnosisSignals: inputData.diagnosisSignals,\n          knownUnknowns: inputData.unknowns,',1)
          cash='                  value: currency.format(data.cash),\n                  change: percent(data.cashChange),'
          s=s.replace(cash,'                  value: data.cash === 0 && data.source === "upload" ? "N/A" : currency.format(data.cash),\n                  change: data.cash === 0 && data.source === "upload" ? "No cash data" : percent(data.cashChange),',1)
          om='<h3 className="mt-1 text-xl font-bold text-slate-900">What changed, why it matters, and what to do next.</h3>'
          if om not in s: raise SystemExit('overlay marker missing')
          s=s.replace(om,om+'\n            <div className="mt-4 flex flex-wrap gap-2"><button type="button" onClick={() => { setShowAnalysis(false); window.setTimeout(() => fileRef.current?.click(), 0); }} className="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700">Upload another workbook</button><button type="button" onClick={() => setShowAnalysis(false)} className="rounded-lg bg-blue-600 px-3 py-2 text-xs font-semibold text-white">Back to Briefing</button></div>',1)
          p.write_text(s)

          p=Path('src/app/api/cfo-analysis/route.ts'); s=p.read_text()
          marker='  "Use multiPeriodInsights as the historical-pattern layer.",'
          if marker not in s: raise SystemExit('AI instructions marker missing')
          extra='''\n\n  "Use diagnosisSignals as a deterministic pattern-detection layer. When present, explicitly name the supported pattern in the executive summary, primary driver, evidence, and recommended action where relevant.",\n  "For inventoryBuildup, discuss inventory accumulating faster than revenue or COGS and use inventory days when supplied; do not prescribe a specific purchase reduction unless evidence supports it.",\n  "For operatingExpenseSpikeRecovery, distinguish the expense spike from the subsequent recovery and include the supplied dollar impact; do not substitute a revenue spike for the expense pattern.",\n  "For revenueVolatility, prioritize the observed range and volatility over a simple straight-line trend. If possibleSeasonality is true, describe seasonality as a possibility rather than a proven cause unless comparable periods establish it.",'''
          s=s.replace(marker,marker+extra,1); p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          npm ci
          npx tsc --noEmit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CFOBriefing.tsx src/app/api/cfo-analysis/route.ts
          git rm .github/workflows/apply-diagnosis-improvements.yml .github/workflows/apply-diagnosis-pr.yml ANALYSIS_PATTERN_TRIGGER.md 2>/dev/null || true
          git commit -m "Add deterministic financial pattern detection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
