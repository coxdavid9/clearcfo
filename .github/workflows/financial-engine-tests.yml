name: ClearCFO Financial Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  financial-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Run security regression checks
        run: npm run test:security

      - name: Run deterministic financial engine regression tests
        run: node scripts/financial-engine-scenarios.mjs

      - name: Run HVAC golden-case regression tests
        run: node scripts/hvac-golden-scenarios.mjs

      - name: Run reasoning scenarios
        run: npm run test:reasoning

      - name: Run trend scenarios
        run: npm run test:trends

      - name: Run alert engine scenarios
        run: |
          npm run test:alerts
          npm run test:due
          npm run test:email

      - name: Verify production build
        run: npm run build
