name: ClearCFO Financial Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  financial-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hardening patches
        run: |
          python - <<'PY'
          from pathlib import Path

          briefing = Path('src/components/CFOBriefing.tsx')
          text = briefing.read_text()
          if 'hasValidAnalysis' not in text:
              replacements = [
                  ('  const [aiError, setAiError] =\n    useState("");\n\n  const [expandedMetric, setExpandedMetric] =', '  const [aiError, setAiError] =\n    useState("");\n\n  const [hasValidAnalysis, setHasValidAnalysis] =\n    useState(true);\n\n  const [expandedMetric, setExpandedMetric] ='),
                  ('    setUploading(true);\n    setError("");\n    setAiError("");', '    setUploading(true);\n    setError("");\n    setAiError("");\n    setHasValidAnalysis(false);'),
                  ('      setData(analyzed);\n      await generateAIAnalysis(analyzed);', '      setData(analyzed);\n      setHasValidAnalysis(true);\n      await generateAIAnalysis(analyzed);'),
                  ('    } catch (err) {\n      setError(\n        err instanceof Error', '    } catch (err) {\n      setHasValidAnalysis(false);\n      setError(\n        err instanceof Error'),
                  ('  return (\n    <div className="px-5 py-8 sm:px-8 sm:py-12 lg:py-16">', '''  if (!hasValidAnalysis) {
    return (
      <div className="px-5 py-8 sm:px-8 sm:py-12 lg:py-16">
        <div className="mx-auto w-full max-w-6xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-[0_25px_80px_-35px_rgba(15,23,42,0.35)]">
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleUpload} />
          <div className="border-b border-slate-200 bg-white px-6 py-6 sm:px-8 sm:py-7"><div className="flex items-center justify-between gap-3"><div><p className="text-xs font-bold uppercase tracking-[0.18em] text-blue-600">ClearCFO Intelligence</p><p className="mt-1 text-xs text-slate-500">Financial briefing</p></div><button type="button" onClick={() => fileRef.current?.click()} className="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:border-blue-300 hover:text-blue-600">{uploading ? "Analyzing…" : "Upload Excel"}</button></div></div>
          <div className="p-7 sm:p-10">{error && <div className="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-6 text-red-700">{error}</div>}{emptyState}</div>
        </div>
      </div>
    );
  }

  return (
    <div className="px-5 py-8 sm:px-8 sm:py-12 lg:py-16">'''),
                  ('<p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Underlying account drivers</p>', '<p className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Largest account movements</p>'),
                  ('  if (inventoryChange > 0 && revenueChange < inventoryChange) {\n    relationships.push("Inventory is increasing faster than revenue, which can tie up cash without a matching increase in sales.");\n  }', '  if (inventoryChange >= 5 && inventoryChange > revenueChange + 3) {\n    relationships.push("Inventory is increasing faster than revenue, which can tie up cash without a matching increase in sales.");\n  }'),
                  ('  if (inventoryChange > 0 && cashChange < 0) {\n    relationships.push("Inventory is rising while cash is falling, a combination that can indicate working capital is being absorbed by stock growth.");\n  }', '  if (inventoryChange >= 5 && cashChange <= -5) {\n    relationships.push("Inventory is rising while cash is falling, a combination that can indicate working capital is being absorbed by stock growth.");\n  }'),
                  ('{aiAnalysis.priority} priority · {aiAnalysis.confidence >= 85 ? "High" : aiAnalysis.confidence >= 65 ? "Moderate" : "Limited"} confidence', '{data.attention === 0 ? "Monitor" : aiAnalysis.priority} · {aiAnalysis.confidence >= 85 ? "High" : aiAnalysis.confidence >= 65 ? "Moderate" : "Limited"} confidence'),
                  ('{aiAnalysis.whyItMatters}', '{compactWhyItMatters(aiAnalysis.whyItMatters)}'),
              ]
              for old, new in replacements:
                  if old not in text: raise SystemExit(f'Briefing patch block not found: {old[:80]}')
                  text = text.replace(old, new, 1)
              marker = 'function scoreAIAction(action: AIAction): number {'
              helper = '''function compactWhyItMatters(text: string): string {
  const sentences = text.match(/[^.!?]+[.!?]+/g) ?? [text];
  let compact = sentences.slice(0, 3).join(" ").trim();
  const words = compact.split(/\\s+/).filter(Boolean);
  if (words.length > 55) compact = words.slice(0, 55).join(" ").replace(/[,:;]$/, "") + "…";
  return compact;
}

'''
              if marker not in text: raise SystemExit('Could not find scoreAIAction marker')
              text = text.replace(marker, helper + marker, 1)
              briefing.write_text(text)

          route = Path('src/app/api/cfo-analysis/route.ts')
          rtext = route.read_text()
          pairs = [
              ('  "Keep the explanation concise enough for a business owner, controller, or CFO to use in a management meeting.",', '  "Keep the explanation concise enough for a business owner, controller, or CFO to use in a management meeting.",\n\n  "The whyItMatters field must be concise: 2 to 3 sentences and no more than about 55 words. Explain the business significance without repeating the executiveSummary, evidence list, or recommendedAction.",'),
              ('  "If multiple drivers interact, describe the relationship as a plausible connection rather than proven causation unless the supplied data establishes causation.",', '  "If multiple drivers interact, describe the relationship as a plausible connection rather than proven causation unless the supplied data establishes causation.",\n\n  "Use calibrated causal language: prefer coincides with, is consistent with, may contribute to, can indicate, or suggests when the data does not establish causation. Do not say a factor caused an outcome unless the supplied evidence establishes that causal link.",'),
          ]
          for old, new in pairs:
              if old not in rtext: raise SystemExit(f'API instruction block not found: {old[:80]}')
              rtext = rtext.replace(old, new, 1)
          route.write_text(rtext)
          PY

      - name: Commit hardening changes
        run: |
          if git diff --quiet -- src/components/CFOBriefing.tsx src/app/api/cfo-analysis/route.ts; then
            echo "No hardening changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CFOBriefing.tsx src/app/api/cfo-analysis/route.ts
            git commit -m "chore: Apply ClearCFO hardening"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic financial engine regression tests
        run: node scripts/financial-engine-scenarios.mjs

      - name: Run reasoning scenarios
        run: npm run test:reasoning

      - name: Run trend scenarios
        run: npm run test:trends

      - name: Verify production build
        run: npm run build
