name: ClearCFO Financial Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  financial-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Verify Next lint dependency compatibility
        run: npm run test:lint-dependencies

      - name: Run signup and legal acceptance regression checks
        run: npm run test:auth-signup

      - name: Run Stripe billing compatibility checks
        run: npm run test:billing

      - name: Verify financial cache isolation
        run: npm run test:financial-cache

      - name: Run security regression checks
        run: npm run test:security

      - name: Verify two-customer AI analysis isolation
        run: npm run test:tenant-isolation

      - name: Run deterministic financial engine regression tests
        run: |
          node scripts/financial-engine-scenarios.mjs
          node --experimental-strip-types scripts/emerging-constraints-scenarios.mjs

      - name: Verify operating losses and evidence boundaries
        run: npm run test:insight-evidence

      - name: Run Excel header regression test
        run: npm run test:excel-header

      - name: Run HVAC golden-case regression tests
        run: node scripts/hvac-golden-scenarios.mjs

      - name: Run reasoning scenarios
        run: npm run test:reasoning

      - name: Run trend scenarios
        run: npm run test:trends

      - name: Run alert engine scenarios
        run: |
          npm run test:alerts
          npm run test:due
          npm run test:email

      - name: Verify production build
        run: npm run build
