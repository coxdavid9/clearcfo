            diff --git a/src/lib/quickbooks.ts b/src/lib/quickbooks.ts
            --- a/src/lib/quickbooks.ts
            +++ b/src/lib/quickbooks.ts
            @@ -4,6 +4,7 @@ import { getAuthCookieNames, getSupabaseUser } from "./supabase-auth";
             
