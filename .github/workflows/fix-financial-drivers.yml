name: Fix financial drivers visibility

on:
  push:
    branches:
      - fix/always-show-financial-drivers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Make financial drivers always visible
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/CFOBriefing.tsx')
          text = path.read_text()

          old_state = 'const [showFinancialDetail, setShowFinancialDetail] = useState(false);'
          if old_state in text:
              text = text.replace(old_state, 'const showFinancialDetail = true;', 1)
          elif 'const showFinancialDetail = true;' not in text:
              raise SystemExit('Financial detail state declaration was not found')

          button_pattern = re.compile(
              r'\s*<button\n'
              r'\s*type="button"\n'
              r'\s*onClick=\{\(\) => setShowFinancialDetail\(\(value\) => !value\)\}\n'
              r'\s*aria-expanded=\{showFinancialDetail\}\n'
              r'\s*className="[^"]*"\n'
              r'\s*>\n'
              r'\s*\{showFinancialDetail \? "Hide financial detail -" : "View financial detail \+"\}\n'
              r'\s*</button>',
              re.MULTILINE,
          )
          text, removed = button_pattern.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected financial detail toggle button was not removed (removed={removed})')

          path.write_text(text)
          PY

      - name: Verify and commit
        run: |
          grep -q 'const showFinancialDetail = true;' src/components/CFOBriefing.tsx
          ! grep -q 'View financial detail' src/components/CFOBriefing.tsx
          ! grep -q 'Hide financial detail' src/components/CFOBriefing.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CFOBriefing.tsx
          git rm .github/workflows/fix-financial-drivers.yml
          git commit -m 'fix: keep financial drivers expanded'
          git push
